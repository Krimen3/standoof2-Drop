<head>
  <meta charset="utf-8" />

  <link rel="stylesheet" href="style.css" />
  <style>
    /* стили для отзывов с раскрытием */
    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 18px;
    }
    .review-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12));
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.04);
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
      cursor: pointer;
    }
    .review-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 60px rgba(0,0,0,0.3);
      border-color: rgba(0,255,255,0.08);
    }
    .review-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px 12px 18px;
    }
    .review-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #0a0a10;
      flex-shrink: 0;
      background: linear-gradient(135deg, #ffd700, #ff6b00);
      box-shadow: 0 4px 20px rgba(255,215,0,0.12);
    }
    .review-avatar.green { background: linear-gradient(135deg, #00ff88, #00cc66); }
    .review-avatar.pink { background: linear-gradient(135deg, #ff44cc, #ff0088); }
    .review-avatar.blue { background: linear-gradient(135deg, #44aaff, #0066ff); }
    .review-avatar.purple { background: linear-gradient(135deg, #aa66ff, #6600cc); }
    .review-avatar.orange { background: linear-gradient(135deg, #ff8844, #ff4400); }
    .review-avatar.cyan { background: linear-gradient(135deg, #00ffcc, #00cc99); }
    .review-avatar.red { background: linear-gradient(135deg, #ff4466, #cc0033); }
    .review-avatar.lime { background: linear-gradient(135deg, #aaff44, #66cc00); }

    .review-nick {
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }
    .review-amount {
      font-size: 13px;
      color: var(--gold);
      font-weight: 600;
    }
    .review-date {
      font-size: 11px;
      color: #666;
      margin-left: auto;
    }
    .review-preview {
      padding: 0 18px 12px 18px;
      color: #aaa;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .review-preview .arrow {
      display: inline-block;
      transition: transform 0.3s;
      margin-left: 6px;
      color: var(--neon-blue);
    }
    .review-preview .arrow.open {
      transform: rotate(180deg);
    }
    .review-full {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.2, 0.9, 0.25, 1), padding 0.3s, opacity 0.3s;
      opacity: 0;
      padding: 0 18px;
    }
    .review-full.open {
      max-height: 400px;
      opacity: 1;
      padding: 0 18px 16px 18px;
    }
    .review-full .message {
      background: rgba(255,255,255,0.03);
      padding: 12px 16px;
      border-radius: 12px;
      border-left: 3px solid var(--neon-blue);
      color: #dcdcdc;
      font-size: 14px;
      line-height: 1.5;
    }
    .review-full .admin-reply {
      margin-top: 10px;
      background: rgba(0,255,255,0.04);
      padding: 10px 16px;
      border-radius: 12px;
      border-left: 3px solid var(--gold);
      color: #cfcfcf;
      font-size: 13px;
    }
    .review-full .admin-reply .admin-label {
      color: var(--gold);
      font-weight: 600;
      font-size: 12px;
      display: block;
      margin-bottom: 4px;
    }
    .review-full .admin-reply .admin-label span {
      background: linear-gradient(135deg, #ffd700, #ff8800);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    .review-stars {
      color: var(--gold);
      font-size: 14px;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    @media (max-width: 980px) {
      .reviews-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 640px) {
      .reviews-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

      card.className = 'review-card';

      const colorClass = avatarColors[index % avatarColors.length];

      // звезды (рандомно 4-5)
      const stars = Math.random() > 0.3 ? '★★★★★' : '★★★★☆';

      card.innerHTML = `
        <div class="review-header">
          <div class="review-avatar ${colorClass}">${review.nick.charAt(0).toUpperCase()}</div>
          <div>
            <div class="review-nick">${review.nick}</div>
            <div class="review-amount">💰 ${review.amount.toLocaleString()} голды</div>
          </div>
          <div class="review-date">${review.date}</div>
        </div>
        <div class="review-preview">
          ${review.preview}
          <span class="arrow">▼</span>
        </div>
        <div class="review-full">
          <div class="review-stars">${stars}</div>
          <div class="message">💬 ${review.message}</div>
          <div class="admin-reply">
            <div class="admin-label">👑 <span>Kruemen</span> — ответ админа:</div>
            ${review.adminReply}
          </div>
        </div>
      `;

        const full = this.querySelector('.review-full');
        const arrow = this.querySelector('.arrow');
        const isOpen = full.classList.contains('open');

        // закрываем все остальные
        document.querySelectorAll('.review-full.open').forEach(el => {
          if (el !== full) {
            el.classList.remove('open');
            el.closest('.review-card').querySelector('.arrow').classList.remove('open');
          }
        });

        full.classList.toggle('open');
        arrow.classList.toggle('open');

        // скролл к отзыву если открыли
        if (!isOpen) {
          setTimeout(() => {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 200);
        }
      });

      reviewsGrid.appendChild(card);
