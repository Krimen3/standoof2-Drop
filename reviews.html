    const avatarColors = ['green', 'pink', 'blue', 'purple', 'orange', 'cyan', 'red', 'lime'];

    reviews.forEach((review, index) => {
      const card = document.createElement('div');
      card.className = 'review-card';
      const colorClass = avatarColors[index % avatarColors.length];
      const stars = Math.random() > 0.3 ? '★★★★★' : '★★★★☆';

      card.innerHTML = `
        <div class="review-header">
          <div class="review-avatar ${colorClass}">${review.nick.charAt(0).toUpperCase()}</div>
          <div>
            <div class="review-nick">${review.nick}</div>
            <div class="review-amount">💰 ${review.amount.toLocaleString()} голды</div>
          </div>
          <div class="review-date">${review.date}</div>
        </div>
        <div class="review-preview">
          ${review.preview}
          <span class="arrow">▼</span>
        </div>
        <div class="review-full">
          <div class="review-stars">${stars}</div>
          <div class="message">💬 ${review.message}</div>
          <div class="admin-reply">
            <div class="admin-label">👑 <span>Kruemen</span> — ответ админа:</div>
            ${review.adminReply}
          </div>
        </div>
      `;

      card.addEventListener('click', function() {
        const full = this.querySelector('.review-full');
        const arrow = this.querySelector('.arrow');
        const isOpen = full.classList.contains('open');

        document.querySelectorAll('.review-full.open').forEach(el => {
          if (el !== full) {
            el.classList.remove('open');
            el.closest('.review-card').querySelector('.arrow').classList.remove('open');
          }
        });

        full.classList.toggle('open');
        arrow.classList.toggle('open');

        if (!isOpen) {
          setTimeout(() => {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 200);
        }
      });

      reviewsGrid.appendChild(card);
    });
